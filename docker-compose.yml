services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: processify_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=file:./prisma/dev.db
      - JWT_SECRET=processify_erp_super_secret_jwt_key_2026
      - CORS_ORIGIN=*
    volumes:
      - sqlite_data:/app/prisma
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: processify_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  sqlite_data:
    driver: local
