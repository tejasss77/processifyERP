services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: processify_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=file:./prisma/dev.db
      - JWT_SECRET=processify_erp_super_secret_jwt_key_2026
      - CORS_ORIGIN=*
    volumes:
      - sqlite_data:/app/prisma
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: processify_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  sqlite_data:
    driver: local
